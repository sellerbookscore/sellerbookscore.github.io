<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a35" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="description" content="SellerBooks Core — akses akun dan persetujuan client." />
    <title>SellerBooks Core</title>
    <style>
      body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#14233b}
      .boot{max-width:560px;margin:12vh auto;padding:24px}
      .boot-card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px;box-shadow:0 8px 28px rgba(20,35,59,.06)}
      .boot h1{font-size:22px;margin:0 0 8px}.boot p{line-height:1.6;color:#52627a}
      .boot a{color:#155eef}.boot small{color:#64748b}
    </style>
  </head>
  <body>
    <div id="app">
      <main class="boot"><div class="boot-card">
        <h1>SellerBooks Core</h1>
        <p id="boot-status">Sedang memuat halaman login…</p>
        <small>Jika pesan ini tidak berubah, halaman sedang mengalami kendala saat memuat JavaScript.</small>
        <p><a href="https://sellerbookscore.github.io/?refresh=1">Muat ulang SellerBooks Core</a></p>
      </div></main>
    </div>
    <script type="importmap">
      {"imports":{"@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2"}}
    </script>
    <script>
      window.SELLERBOOKS_CONFIG = window.SELLERBOOKS_CONFIG || {};
      window.addEventListener('error', function (event) {
        var target = document.getElementById('boot-status');
        if (target) target.textContent = 'Gagal memuat aplikasi: ' + (event.message || 'kesalahan JavaScript atau file aplikasi tidak berhasil dimuat') + '. Coba muat ulang atau hubungi administrator.';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var target = document.getElementById('boot-status');
        if (target) target.textContent = 'Gagal memuat aplikasi: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason)) + '.';
      });
    </script>
    <script type="module" src="./src/main.js?v=fix3"></script>
  </body>
</html>
